{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="container text-center mt-5 pt-5">
    <div class="display-1 text-muted mb-4"><i class="fa-solid fa-compass"></i></div>
    <h2 class="fw-bold text-dark mb-3">Page Not Found</h2>
    <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4"><i class="fa-solid fa-arrow-left me-2"></i>Return to Dashboard</a>
</div>
{% endblock %}
